<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ananda Tasikmalaya - Katalog Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2c3e50;
    }
    .nav-list {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }
    .nav-item a {
      text-decoration: none;
      color: #555;
      font-weight: 500;
    }
    .mobile-menu {
      display: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .search-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
    }
    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border: 1px solid #007bff;
      background: #fff;
      color: #007bff;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #007bff;
      color: #fff;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
    }
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    .product-price {
      font-size: 1.1rem;
      color: #e74c3c;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      font-size: 0.85rem;
      color: #777;
    }
    .btn-share-card {
      background: none;
      border: none;
      color: #007bff;
      cursor: pointer;
    }
    /* Modal Detail Produk */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      padding: 1.5rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    .btn-wa {
      display: block;
      width: 100%;
      text-align: center;
      background: #25d366;
      color: #fff;
      padding: 0.75rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 1rem;
    }
    @media (max-width: 768px) {
      .mobile-menu { display: block; }
      .nav-list {
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 60px;
        left: 0;
        background: #fff;
        padding: 1rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .nav-list.show { display: flex; }
    }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <div class="logo">Ananda Tasikmalaya</div>
      <div class="mobile-menu" id="mobile-menu"><i class="fas fa-bars"></i></div>
      <ul class="nav-list" id="nav-list">
        <li class="nav-item"><a href="#">Beranda</a></li>
        <li class="nav-item"><a href="#">Katalog</a></li>
        <li class="nav-item"><a href="#">Kontak</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="search-filter-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Cari produk...">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="pakaian">Pakaian</button>
        <button class="filter-btn" data-filter="makanan">Makanan</button>
        <button class="filter-btn" data-filter="aksesoris">Aksesoris</button>
      </div>
    </div>

    <div class="products-grid" id="products-container">
      <!-- Produk akan dimuat dari Google Sheets -->
    </div>
  </main>

  <!-- Modal Detail Produk -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <img src="" id="modal-img" class="modal-img" alt="Detail Produk">
      <h3 id="modal-title"></h3>
      <p id="modal-price" class="product-price"></p>
      <p id="modal-desc" style="color: #666; margin-top: 0.5rem;"></p>
      <a href="#" id="buy-wa" target="_blank" class="btn-wa">
        <i class="fab fa-whatsapp"></i> Beli via WhatsApp
      </a>
    </div>
  </div>

  <script>
    // URL Google Apps Script Web App terbaru
    const GS_API_URL = 'https://script.google.com/macros/s/AKfycbwSQ52wmWNbGO1y-vA1cOsKYJXfckSR5kN2KA3pr9aFtn80plKzR-4eKH2RDDtQ2djx/exec';

    let products = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let storePhone = '6285624670796';

    const navList = document.getElementById('nav-list');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileMenu) {
      mobileMenu.addEventListener('click', () => navList.classList.toggle('show'));
    }

    // Fungsi Ambil Data dari Apps Script
    async function fetchProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 2rem;">Memuat produk...</p>';
      
      try {
        const res = await fetch(`${GS_API_URL}?action=read&sheet=products`);
        const response = await res.json();
        
        if (response && response.status === 'success') {
          products = response.data;
          renderProducts();
        } else {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:red;">Gagal memuat data produk.</p>';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:red;">Terjadi kesalahan koneksi ke database.</p>';
      }
    }

    // Fungsi Render Tampilan Produk
    function renderProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      const filtered = products.filter(p => {
        const matchCategory = currentCategory === 'all' || (p.category && p.category.toLowerCase() === currentCategory.toLowerCase());
        const matchSearch = !searchQuery || (p.title && p.title.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 2rem;">Produk tidak ditemukan.</p>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(p);

        const priceFormatted = Number(p.price || 0).toLocaleString('id-ID');
        const imgUrl = p.image || 'https://via.placeholder.com/300?text=No+Image';

        card.innerHTML = `
          <img src="${imgUrl}" class="product-img" alt="${p.title}">
          <div class="product-info">
            <div class="product-title">${p.title}</div>
            <div class="product-price">Rp${priceFormatted}</div>
            <div class="product-meta">
              <span class="rating-sold"><i class="fas fa-star" style="color:#f39c12;"></i> 5.0</span>
              <button class="btn-share-card" onclick="event.stopPropagation(); shareProduct('${p.title}')"><i class="fas fa-share-alt"></i></button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filter Kategori Event Listener
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-filter');
        renderProducts();
      });
    });

    // Pencarian Event Listener
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderProducts();
      });
    }

    // Buka Modal Detail
    function openModal(product) {
      document.getElementById('modal-title').innerText = product.title;
      document.getElementById('modal-price').innerText = 'Rp' + Number(product.price || 0).toLocaleString('id-ID');
      document.getElementById('modal-img').src = product.image || 'https://via.placeholder.com/300';
      document.getElementById('modal-desc').innerText = product.description || 'Tidak ada deskripsi.';
      
      document.getElementById('buy-wa').href = `https://wa.me/${storePhone}?text=Halo%20Ananda%20Tasikmalaya,%20saya%20tertarik%20dengan%20produk%20${encodeURIComponent(product.title)}`;
      
      document.getElementById('product-modal').classList.add('active');
    }

    // Tutup Modal
    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('product-modal').classList.remove('active');
    });

    // Bagikan Produk
    function shareProduct(title) {
      if (navigator.share) {
        navigator.share({ title: title, url: window.location.href });
      } else {
        alert('Link disalin ke clipboard!');
      }
    }

    // Panggil Data Pertama Kali saat Halaman Selesai Dimuat
    window.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</body>
</html>
